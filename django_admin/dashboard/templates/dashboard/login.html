<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login - Blog Management System
    </title>


    <style>

        body {

            margin: 0;

            font-family:
                Arial,
                sans-serif;

            background:
                #f5f7fb;
        }


        .container {

            width:
                100%;

            min-height:
                100vh;

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;
        }


        .login-card {

            width:
                380px;

            background:
                white;

            padding:
                40px;

            border-radius:
                12px;

            box-shadow:
                0 3px 15px
                rgba(0, 0, 0, 0.10);
        }


        h1 {

            text-align:
                center;

            margin-top:
                0;

            margin-bottom:
                10px;
        }


        .subtitle {

            text-align:
                center;

            color:
                #666;

            margin-bottom:
                30px;
        }


        label {

            display:
                block;

            margin-bottom:
                8px;

            font-weight:
                bold;
        }


        input {

            width:
                100%;

            box-sizing:
                border-box;

            padding:
                12px;

            margin-bottom:
                20px;

            border:
                1px solid #ccc;

            border-radius:
                6px;

            font-size:
                15px;
        }


        button {

            width:
                100%;

            padding:
                12px;

            background:
                #2563eb;

            color:
                white;

            border:
                none;

            border-radius:
                6px;

            font-size:
                16px;

            font-weight:
                bold;

            cursor:
                pointer;
        }


        button:hover {

            background:
                #1d4ed8;
        }


        .error {

            background:
                #fee2e2;

            color:
                #b91c1c;

            padding:
                12px;

            border-radius:
                6px;

            margin-bottom:
                20px;

            text-align:
                center;
        }


        .back {

            display:
                block;

            text-align:
                center;

            margin-top:
                20px;

            color:
                #2563eb;

            text-decoration:
                none;
        }

    </style>

</head>


<body>


    <div class="container">


        <div class="login-card">


            <h1>
                Blog Management System
            </h1>


            <p class="subtitle">
                Login to your dashboard
            </p>


            {% if error %}

                <div class="error">

                    {{ error }}

                </div>

            {% endif %}


            <form
                method="POST"
            >

                {% csrf_token %}


                <label
                    for="email"
                >
                    Email
                </label>


                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >


                <label
                    for="password"
                >
                    Password
                </label>


                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >


                <button
                    type="submit"
                >
                    Login
                </button>


            </form>


            <a
                href="/"
                class="back"
            >
                Back to Home
            </a>


        </div>


    </div>


</body>

</html>
